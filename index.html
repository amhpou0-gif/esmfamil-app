<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برگه بازی اسم‌فامیل</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
    .card { background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
    h2 { text-align: center; color: #1e293b; margin-top: 0; font-size: 20px; }
    .badge { background: #0284c7; color: white; padding: 4px 14px; border-radius: 15px; font-weight: bold; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #475569; font-size: 13px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
    input:focus { border-color: #0284c7; }
    button { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-link { display: block; text-align: center; background: #0284c7; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>حرف این راند: <span id="roundLetter" class="badge">...</span></h2>
    <div id="fieldsContainer"></div>
    <button id="submitBtn" onclick="submitAnswers()">✅ ثبت نهایی پاسخ‌ها</button>
    <div id="fallbackAction" style="display:none;"></div>
  </div>

  <script>
    let tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
      }
    } catch (e) {
      console.log(e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawLetter = urlParams.get('letter') || 'الف';
    const letter = decodeURIComponent(rawLetter);
    const roomId = urlParams.get('room_id') || 'default';
    const botUser = urlParams.get('bot') || '';

    document.getElementById('roundLetter').innerText = letter;

    const categories = ["اسم", "فامیل", "شهر", "کشور", "غذا", "اشیا", "حیوان", "گیاه", "ماشین", "رنگ"];
    const container = document.getElementById('fieldsContainer');

    categories.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'field';
      div.innerHTML = `
        <label>${cat}</label>
        <input type="text" id="cat_${cat}" placeholder="با «${letter}» شروع شود...">
      `;
      container.appendChild(div);
    });

    function submitAnswers() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "⏳ در حال آماده‌سازی پاسخ‌ها...";

      const answers = {};
      categories.forEach(cat => {
        answers[cat] = document.getElementById(`cat_${cat}`).value.trim();
      });

      const payload = {
        room_id: roomId,
        answers: answers
      };

      const jsonStr = JSON.stringify(payload);
      const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));
      const targetUrl = `https://t.me/${botUser}?start=ans_${encoded}`;

      // تلاش اول با متد اختصاصی وب‌اپ
      try {
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(jsonStr);
        }
      } catch (err) {}

      // هدایت به ربات تلگرام برای ثبت قطعی پاسخ‌ها در دیتابیس
      btn.innerText = "✅ ثبت شد! در حال انتقال به تلگرام...";
      const fallbackDiv = document.getElementById('fallbackAction');
      fallbackDiv.innerHTML = `<a class="btn-link" href="${targetUrl}">👈 برای تأیید نهایی و برگشت به تلگرام اینجا کلیک کنید</a>`;
      fallbackDiv.style.display = "block";

      if (tg && typeof tg.openTelegramLink === 'function') {
        tg.openTelegramLink(targetUrl);
      } else {
        window.location.href = targetUrl;
      }
    }
  </script>
</body>
</html>
